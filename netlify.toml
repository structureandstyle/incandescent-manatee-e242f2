[build]
  command = "npm run build"
  publish = "dist"

# One canonical host. www redirects to the apex, permanently, in one direction.
[[redirects]]
  from = "https://www.structureandstyle.co.uk/*"
  to = "https://structureandstyle.co.uk/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
