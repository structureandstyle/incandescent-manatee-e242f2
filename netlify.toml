[build]
  command = "npm run build"
  publish = "dist"

# Pinned 8 Sep 2026, before the first production build on Netlify. Astro 7
# needs Node 22.12 or later (package.json engines). Pin the exact LTS runtime
# used for the production verification: Node 24.14 currently trips Astro's
# module runner on CommonJS dependencies before the site itself compiles.
# Netlify does not read package.json engines, so this is the deployment pin.
[build.environment]
  NODE_VERSION = "22.20.0"

# Production refuses to ship anything unfinished. `build:production` runs the
# build and then scripts/verify-build.mjs, which exits non-zero if an INDEXABLE
# page still carries an open question, or if any page anywhere breaches the tone
# protocol's factual limits or the house writing standard. A failed verify fails
# the deploy.
[context.production]
  command = "npm run build:production"

# Branch deploys and previews deliberately run the plain build, so the site can
# be built and reviewed while the client's answers are outstanding. That is the
# whole point of the branch: draft pages are visible to us and noindexed to
# everyone else. Netlify also sets X-Robots-Tag: noindex on non-production
# deploys, which is a second belt on top of the per-page meta tag.
[context.branch-deploy]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

# One canonical host. www redirects to the apex, permanently, in one direction.
[[redirects]]
  from = "https://www.structureandstyle.co.uk/*"
  to = "https://structureandstyle.co.uk/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Added 5 Sep 2026. A year of HTTPS-only, without includeSubDomains: the
    # apex and www are both on Netlify and both HTTPS, and leaving subdomains
    # out means nothing anyone puts on one later can be broken by a header set
    # here. Raise it and add preload once the site has been live a while.
    Strict-Transport-Security = "max-age=31536000"
    # This site asks for none of these, so it says so.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    X-Frame-Options = "DENY"
    # DELIBERATELY NOT A FULL CSP. A script-src directive here would need
    # 'unsafe-inline' to allow the consent gate, the reveal observer and the
    # lightbox, and 'unsafe-inline' in script-src is most of the protection
    # given away. These four directives govern nothing that is inline, so they
    # cost nothing and cannot break a page: no framing, no <base> injection, no
    # plugins, and a form can only post back to this origin, which is what
    # Netlify Forms does. A real script-src belongs after launch, written
    # against nonces and verified on the live deploy rather than guessed at
    # here, where nothing can test it.
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"

# CACHING, 5 Sep 2026. Only /fonts/* had a rule, so the two hashed stylesheets
# and 2.7MB of photography were left to Netlify's default revalidation on every
# view. Astro puts a content hash in each /_astro/ filename, which is exactly
# the condition immutable is for: the URL changes when the bytes do.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The photographs are NOT hashed, so they cannot be immutable: replacing one
# keeps its name. A month with revalidation means a second view of the same
# photograph, and the fitted-wardrobe set is shared by two pages, comes from
# the browser rather than the network, and a replacement is still picked up on
# the next revalidation rather than a year later.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# The share cards, /og/*.jpg and /og-default.jpg, 7 Sep 2026: unhashed like
# the photographs and fetched by every scraper that unfurls a link, and until
# now the one asset class with no rule at all.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"
